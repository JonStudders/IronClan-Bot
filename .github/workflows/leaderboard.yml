name: Update leaderboard (manual fallback)

# NOT SCHEDULED ANY MORE.
#
# The bot now runs as a persistent service on Oracle Cloud (see
# docs/deployment-oracle.md), which updates the board on its own timer. If this
# workflow also ran on a schedule the two would fight over the same messages -
# each deleting the other's post every few minutes.
#
# It is kept as a manual escape hatch: if the server is down and you want the
# board refreshed once, trigger this from the Actions tab. Running it while the
# server is up is harmless but pointless - the service will repost on its next
# cycle.
on:
  workflow_dispatch:

concurrency:
  group: leaderboard
  cancel-in-progress: false

env:
  botToken: ${{ secrets.BOT_TOKEN || secrets.BOTTOKEN }}
  sheetId: ${{ secrets.SHEET_ID || secrets.SHEETID }}
  discordChannelId: ${{ secrets.DISCORD_CHANNEL_ID || secrets.DISCORDCHANNELID }}

  sheetName: Leaderboard
  bingoTitle: Iron Clan Bingo - Autumn 2026
  leaderboardUrl: https://bit.ly/4osZatV
  bingoEndTimestamp: '1790539200'
  thumbnailUrl: https://i.imgur.com/i59D7Uy.png
  embedColour: '#6B8E23'
  credit: BlancoIron
  updateIntervalMinutes: '10'
  gainers: 'on'
  gainersRows: '3'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the required secrets are set
        run: |
          missing=""
          if [ -z "$botToken" ]; then missing="$missing BOT_TOKEN"; fi
          if [ -z "$sheetId" ]; then missing="$missing SHEET_ID"; fi
          if [ -z "$discordChannelId" ]; then missing="$missing DISCORD_CHANNEL_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          echo "All three secrets are present."

      # No state cache: rank arrows live on the server now. A one-off manual run
      # will show NEW against every team, which is expected.
      - name: Update the leaderboard
        run: npm run update
